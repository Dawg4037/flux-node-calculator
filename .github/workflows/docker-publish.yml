# Builds the Docker image and pushes it to Docker Hub whenever the `release` branch is updated.
# The image tag is the `version` in package.json. A version that's already on Docker Hub is never
# overwritten: bump the version for every release.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  – Docker Hub username (dawg4037)
#   DOCKERHUB_TOKEN     – Docker Hub access token with Read & Write scope

name: Publish Docker image

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: dawg4037/flux-node-calculator

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.version }} already exists on Docker Hub. Bump \"version\" in package.json and push again."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile runs the test suite; a failing test stops the publish.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:${{ steps.version.outputs.version }}\`"
            echo
            echo "In FluxCloud: Manage → Subscription → Update → set the image to \`$IMAGE:${{ steps.version.outputs.version }}\`, Renewal off, then sign."
          } >> "$GITHUB_STEP_SUMMARY"
