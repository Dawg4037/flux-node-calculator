# Builds a private-preview image whenever the `preview` branch is updated, tagged
# `dawg4037/flux-node-calculator:preview` (overwritten each time). It is never tagged `latest`
# or a version, so the live FluxCloud app is unaffected. Run it on your own machine:
#
#   docker pull dawg4037/flux-node-calculator:preview
#   docker run --rm -p 8080:8080 dawg4037/flux-node-calculator:preview
#   → open http://localhost:8080
#
# Uses the same secrets as docker-publish.yml.

name: Publish preview image

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-preview
  cancel-in-progress: true

env:
  IMAGE: dawg4037/flux-node-calculator

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile runs the test suite; a failing test stops the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:preview
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Preview image \`$IMAGE:preview\` updated"
            echo
            echo '```'
            echo "docker pull $IMAGE:preview"
            echo "docker run --rm -p 8080:8080 $IMAGE:preview"
            echo '```'
            echo "Then open http://localhost:8080. Not public; the live app is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
