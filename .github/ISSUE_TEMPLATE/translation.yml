name: Suggest a better translation
description: Wording in any language other than English that's wrong, unclear or unnatural.
title: "Translation: "
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Português (Brasil)
        - Bahasa Indonesia
        - Español
        - Deutsch
        - Français
        - Polski
        - Русский
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text as it appears on the page, and say where it is (tab or section).
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
    validations:
      required: true
